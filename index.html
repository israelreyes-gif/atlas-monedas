<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Atlas de Monedas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="theme-color" content="#0D1420">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="app">
  <canvas id="globe-canvas"></canvas>
  <canvas id="map-canvas"></canvas>
  <div id="breadcrumb"></div>
  <div id="counter"></div>

  <div id="search-wrap">
    <input id="search-input" type="text" placeholder="Buscar ciudad…" autocomplete="off">
    <div id="search-results"></div>
  </div>

  <div id="hint">1 dedo: gira/mueve · 2 dedos o rueda: zoom · toca un punto para navegar</div>

  <div id="panel">
    <button class="close" aria-label="Cerrar">&times;</button>
    <div id="panel-body"></div>
  </div>
</div>

<!-- Módulos, en orden de dependencia. Nada de build step: son <script> normales. -->
<script src="js/geo-utils.js"></script>
<script src="js/globe.js"></script>
<script src="js/world-data.js"></script>
<script src="js/collection.js"></script>
<script src="js/city-info.js"></script>
<script src="js/city-panel.js"></script>
<script src="js/markers.js"></script>
<script src="js/country-map.js"></script>
<script src="js/search.js"></script>
<script src="js/main.js"></script>
</body>
</html>
